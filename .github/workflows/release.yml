name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p build/
          TAG_NAME=${GITHUB_REF#refs/tags/}

          # Linux amd64 & arm64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/vapeu-linux-amd64 ./cmd/apicli
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/vapeu-linux-arm64 ./cmd/apicli

          # macOS amd64 & arm64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/vapeu-darwin-amd64 ./cmd/apicli
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/vapeu-darwin-arm64 ./cmd/apicli

          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/vapeu-windows-amd64.exe ./cmd/apicli

          # Create archives
          cd build/
          tar -czvf vapeu_${TAG_NAME}_linux_amd64.tar.gz vapeu-linux-amd64
          tar -czvf vapeu_${TAG_NAME}_linux_arm64.tar.gz vapeu-linux-arm64
          tar -czvf vapeu_${TAG_NAME}_darwin_amd64.tar.gz vapeu-darwin-amd64
          tar -czvf vapeu_${TAG_NAME}_darwin_arm64.tar.gz vapeu-darwin-arm64
          zip vapeu_${TAG_NAME}_windows_amd64.zip vapeu-windows-amd64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.tar.gz
            build/*.zip
          generate_release_notes: true
